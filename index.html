<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Đầu Tiên Của Tôi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            padding-top: 50px;
        }
        h1 { color: #007bff; }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Chào mừng bạn đến với thế giới lập trình!</h1>
    <p>Trang web này được xây dựng hoàn toàn trên iPad Pro M1.</p>
    
    <!-- Nút bấm này sẽ kích hoạt hàm trong file JavaScript của bạn -->
    <button onclick="chayThu()">Bấm vào đây</button>

    <!-- Dòng dưới này dùng để liên kết với file script.js của bạn -->
    <script src="script.js"></script>
</body>
</html>
